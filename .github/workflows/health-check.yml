name: Health check

on:
  push:
  pull_request:

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start API
        run: npm start &

      - name: Verify health endpoint
        run: curl --fail --retry 5 --retry-connrefused http://localhost:3000/api/health
